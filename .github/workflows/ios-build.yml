name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show available iOS simulators
        run: xcrun simctl list devices available

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project IOSRunnerPlayground.xcodeproj \
            -scheme IOSRunnerPlayground \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            build

      - name: Find built application
        run: find build -name "*.app" -type d

      - name: Boot iPhone Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | \
            grep -m 1 "iPhone" | \
            sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')

          echo "Using simulator: $DEVICE_ID"

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

          echo "SIMULATOR_UDID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Run UI tests
        run: |
          xcodebuild \
            test \
            -project IOSRunnerPlayground.xcodeproj \
            -scheme IOSRunnerPlayground \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build

      - name: Install application
        run: |
          APP_PATH=$(find build -name "IOSRunnerPlayground.app" -type d | head -1)

          echo "Installing: $APP_PATH"

          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

      - name: Get bundle identifier
        run: |
          APP_PATH=$(find build -name "IOSRunnerPlayground.app" -type d | head -1)

          echo "Application: $APP_PATH"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist")

          echo "Bundle identifier: $BUNDLE_ID"

          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

      - name: Launch application
        run: |
          echo "Launching: $BUNDLE_ID"
          xcrun simctl launch "$SIMULATOR_UDID" "$BUNDLE_ID"

      - name: Wait for app to render
        run: sleep 3

      - name: Take simulator screenshot
        run: |
          xcrun simctl io "$SIMULATOR_UDID" screenshot ios-simulator.png

      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: ios-simulator.png

      - name: List simulator devices
        run: xcrun simctl list devices

      
      - name: Build for physical iPhone
        run: |
          xcodebuild \
            -project IOSRunnerPlayground.xcodeproj \
            -scheme IOSRunnerPlayground \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build-device \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build-device/Build/Products/Debug-iphoneos/IOSRunnerPlayground.app"

          test -d "$APP_PATH" || {
            echo "ERROR: iPhone app not found"
            exit 1
          }

          mkdir -p package/Payload
          cp -R "$APP_PATH" package/Payload/

          cd package
          /usr/bin/zip -r ../IOSRunnerPlayground-unsigned.ipa Payload

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-ipa
          path: IOSRunnerPlayground-unsigned.ipa
          if-no-files-found: error

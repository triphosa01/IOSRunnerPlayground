targets:
  IOSRunnerPlayground:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Data/lpyAccounts.db
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.IOSRunnerPlayground
        PRODUCT_NAME: IOSRunnerPlayground
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"